<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <!-- Morning Sky Gradient -->
    <linearGradient id="skyDawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ebe3d5" />
      <stop offset="45%" stop-color="#faedd8" />
      <stop offset="70%" stop-color="#ebd8bf" />
      <stop offset="100%" stop-color="#d6bca2" />
    </linearGradient>
    <!-- Water / Paddy Field Reflection -->
    <linearGradient id="waterReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dfcfb8" />
      <stop offset="60%" stop-color="#c9b79c" />
      <stop offset="100%" stop-color="#b8a184" />
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1000" height="700" fill="#f8f5ee" />
  
  <!-- Outer border -->
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="#d5cbba" stroke-width="1.2" />

  <!-- Landscape Content within margins -->
  <g transform="translate(40, 40)">
    <!-- Sky -->
    <rect width="920" height="380" fill="url(#skyDawn)" />

    <!-- Soft Morning Sun -->
    <circle cx="680" cy="180" r="48" fill="#fff9ed" opacity="0.85" />
    <circle cx="680" cy="180" r="75" fill="#fcecd2" opacity="0.35" />

    <!-- Distant Mountains / Hills (Soft washes) -->
    <path d="M0,280 Q140,210 320,250 Q480,210 650,260 Q800,220 920,250 L920,380 L0,380 Z" fill="#9f9281" opacity="0.45" />
    <path d="M0,290 Q200,240 420,275 Q620,250 820,295 L920,310 L920,380 L0,380 Z" fill="#847665" opacity="0.55" />

    <!-- Middle-ground Tropical Tree Canopy & Village Silhouettes -->
    <path d="M0,320 Q60,300 120,325 Q180,295 260,330 Q340,305 420,325 Q500,290 600,320 Q700,305 820,335 Q880,315 920,325 L920,390 L0,390 Z" fill="#585043" opacity="0.85" />

    <!-- Detailed Pencil and Ink Palm Trees (Veyangoda countryside) -->
    <!-- Palm Cluster 1 (Left) -->
    <g transform="translate(180, 200)">
      <!-- Trunk -->
      <path d="M10,180 Q25,80 15,0" fill="none" stroke="#363028" stroke-width="4" stroke-linecap="round" />
      <!-- Fronds -->
      <path d="M15,0 Q-40,-30 -80,-10 M15,0 Q-30,-60 -70,-50 M15,0 Q0,-80 5,-100 M15,0 Q40,-70 80,-40 M15,0 Q60,-30 90,0 M15,0 Q40,20 70,40 M15,0 Q-20,30 -60,40" fill="none" stroke="#2a251f" stroke-width="2.5" stroke-linecap="round" />
      <!-- Fine leaflets -->
      <path d="M-40,-20 L-50,-10 M-30,-40 L-40,-30 M10,-70 L20,-60 M40,-50 L50,-40 M50,-20 L65,-10" stroke="#3d372e" stroke-width="1.5" />
    </g>

    <!-- Palm Cluster 2 (Right) -->
    <g transform="translate(760, 160)">
      <path d="M10,220 Q-15,100 0,0" fill="none" stroke="#363028" stroke-width="4.5" stroke-linecap="round" />
      <path d="M0,0 Q-50,-40 -90,-20 M0,0 Q-30,-70 -60,-80 M0,0 Q20,-85 30,-110 M0,0 Q60,-60 100,-30 M0,0 Q70,-10 95,25 M0,0 Q-30,40 -70,50" fill="none" stroke="#25211b" stroke-width="2.8" stroke-linecap="round" />
    </g>

    <!-- Water & Paddy Field Foreground -->
    <rect y="380" width="920" height="240" fill="url(#waterReflect)" />

    <!-- Paddy bunds / ridges and reflections -->
    <path d="M0,380 Q300,375 600,385 Q750,380 920,380" stroke="#383229" stroke-width="3" fill="none" />
    <path d="M-20,440 Q350,420 580,450 Q780,430 940,460" stroke="#484034" stroke-width="4" fill="none" />
    <path d="M0,520 Q400,490 650,530 Q820,510 940,540" stroke="#322b22" stroke-width="4.5" fill="none" />

    <!-- Water Ripples & Grass Stems -->
    <line x1="80" y1="410" x2="220" y2="410" stroke="#f0e2cd" stroke-width="1.8" opacity="0.7" />
    <line x1="420" y1="400" x2="560" y2="400" stroke="#f0e2cd" stroke-width="1.8" opacity="0.7" />
    <line x1="680" y1="420" x2="800" y2="420" stroke="#f0e2cd" stroke-width="2.5" opacity="0.8" />
    <line x1="260" y1="480" x2="480" y2="480" stroke="#eee0cb" stroke-width="2" opacity="0.6" />

    <!-- Detailed Foreground Reeds and Grasses -->
    <g transform="translate(60, 560)">
      <path d="M0,60 Q-10,0 -30,-40 M10,60 Q10,10 0,-50 M20,60 Q30,10 40,-45 M35,60 Q60,10 80,-35" stroke="#26211a" stroke-width="2.5" stroke-linecap="round" fill="none" />
    </g>
    <g transform="translate(800, 550)">
      <path d="M0,70 Q-15,10 -25,-40 M15,70 Q20,10 30,-50 M30,70 Q50,20 70,-35" stroke="#26211a" stroke-width="2.5" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Artist Signature -->
  <g transform="translate(800, 640)">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="19" fill="#3a342c">Indika W.</text>
    <line x1="-8" y1="5" x2="70" y2="5" stroke="#544b3f" stroke-width="1" />
  </g>
</svg>
