<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- Paper base -->
    <radialGradient id="wcPaper" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="70%" stop-color="#f5eee2" />
      <stop offset="100%" stop-color="#eae0cf" />
    </radialGradient>

    <!-- Watercolor Lotus Petal Gradients (Translucent layers) -->
    <radialGradient id="petalPink" cx="50%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#c94e6b" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#e27c95" stop-opacity="0.75" />
      <stop offset="85%" stop-color="#f6becb" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbf0f2" stop-opacity="0.2" />
    </radialGradient>
    <radialGradient id="petalDeep" cx="50%" cy="85%" r="75%">
      <stop offset="0%" stop-color="#9e2f49" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#cf5673" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#f9c8d2" stop-opacity="0.3" />
    </radialGradient>
    <radialGradient id="leafGreen" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#557556" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#3d563e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#243625" stop-opacity="0.9" />
    </radialGradient>
    <radialGradient id="waterWash" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#698586" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#466264" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2b3f40" stop-opacity="0.1" />
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#wcPaper)" />
  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#d5cbba" stroke-width="1.2" />

  <!-- Watercolor Lotus Blossom Composition -->
  <g transform="translate(400, 520)">
    <!-- Water Splashes / Background Washes -->
    <ellipse cx="0" cy="180" rx="340" ry="120" fill="url(#waterWash)" />
    <!-- Fine watercolor bleeds -->
    <circle cx="-160" cy="80" r="85" fill="#5a7a7b" opacity="0.15" />
    <circle cx="180" cy="120" r="110" fill="#4b6b6c" opacity="0.12" />

    <!-- Big Broad Lotus Leaf (Nelumbo Nucifera) in background -->
    <path d="M-220,120 Q-320,60 -240,-40 Q-140,-120 0,-100 Q140,-120 240,-40 Q320,60 220,120 Q100,160 0,140 Q-100,160 -220,120 Z" fill="url(#leafGreen)" opacity="0.75" />
    <!-- Leaf veins (Soft organic watercolor strokes) -->
    <path d="M0,40 Q-80,0 -160,-20 M0,40 Q-120,40 -200,60 M0,40 Q-80,90 -160,110 M0,40 Q80,0 160,-20 M0,40 Q120,40 200,60 M0,40 Q80,90 160,110" stroke="#7e9c7f" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Water Drops on Leaf -->
    <circle cx="-90" cy="40" r="9" fill="#ffffff" opacity="0.65" />
    <circle cx="-88" cy="38" r="3" fill="#ffffff" />
    <circle cx="110" cy="60" r="12" fill="#ffffff" opacity="0.6" />
    <circle cx="108" cy="57" r="4" fill="#ffffff" />

    <!-- Stem of Lotus -->
    <path d="M0,0 Q-15,180 -10,380" stroke="#364937" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M0,0 Q-15,180 -10,380" stroke="#5d7b5f" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
    <!-- Small thorns/texture on stem -->
    <line x1="-12" y1="120" x2="-18" y2="124" stroke="#253526" stroke-width="2" />
    <line x1="-7" y1="190" x2="-1" y2="194" stroke="#253526" stroke-width="2" />
    <line x1="-14" y1="260" x2="-20" y2="264" stroke="#253526" stroke-width="2" />

    <!-- Outer Lotus Petals (Flowing translucent watercolor) -->
    <!-- Left outer petal -->
    <path d="M0,20 Q-140,20 -160,-80 Q-170,-180 -80,-240 Q-50,-120 0,0" fill="url(#petalPink)" />
    <!-- Right outer petal -->
    <path d="M0,20 Q140,20 160,-80 Q170,-180 80,-240 Q50,-120 0,0" fill="url(#petalPink)" />

    <!-- Lower center petal unfolding -->
    <path d="M-80,-20 Q0,80 80,-20 Q50,-60 0,-70 Q-50,-60 -80,-20 Z" fill="url(#petalDeep)" />

    <!-- Mid-tier Petals -->
    <path d="M0,10 Q-110,-40 -110,-160 Q-90,-270 -20,-310 Q-20,-170 0,0" fill="url(#petalDeep)" />
    <path d="M0,10 Q110,-40 110,-160 Q90,-270 20,-310 Q20,-170 0,0" fill="url(#petalDeep)" />

    <!-- Central Majestic Petal pointing upward -->
    <path d="M-40,-40 Q-60,-220 0,-340 Q60,-220 40,-40 Q0,-20 -40,-40 Z" fill="url(#petalPink)" />
    <path d="M-25,-30 Q-40,-200 0,-310 Q40,-200 25,-30 Z" fill="#fdf0f3" opacity="0.65" />

    <!-- Delicate Petal Veins / Watercolor Edges -->
    <path d="M0,-340 Q-10,-180 -20,-40" stroke="#a0304a" stroke-width="1.8" fill="none" opacity="0.5" />
    <path d="M0,-340 Q10,-180 20,-40" stroke="#a0304a" stroke-width="1.8" fill="none" opacity="0.5" />

    <!-- Golden Lotus Seed Pod & Stamens in Center -->
    <g transform="translate(0, -90)">
      <ellipse cx="0" cy="0" rx="30" ry="18" fill="#d99f2b" />
      <ellipse cx="0" cy="0" rx="26" ry="14" fill="#f7c844" />
      <!-- Seeds in pod -->
      <circle cx="-12" cy="-4" r="3" fill="#8c6214" />
      <circle cx="0" cy="-6" r="3" fill="#8c6214" />
      <circle cx="12" cy="-4" r="3" fill="#8c6214" />
      <circle cx="-7" cy="4" r="3" fill="#8c6214" />
      <circle cx="7" cy="4" r="3" fill="#8c6214" />

      <!-- Yellow Golden Stamens radiating outward -->
      <path d="M-28,4 Q-45,6 -55,0 M-26,-4 Q-48,-8 -54,-18 M-15,-14 Q-30,-28 -25,-38 M0,-17 Q0,-35 4,-42 M15,-14 Q30,-28 25,-38 M26,-4 Q48,-8 54,-18 M28,4 Q45,6 55,0" stroke="#e0971b" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <!-- Golden stamen tips -->
      <circle cx="-55" cy="0" r="3" fill="#c47a0b" />
      <circle cx="-54" cy="-18" r="3" fill="#c47a0b" />
      <circle cx="-25" cy="-38" r="3" fill="#c47a0b" />
      <circle cx="4" cy="-42" r="3" fill="#c47a0b" />
      <circle cx="25" cy="-38" r="3" fill="#c47a0b" />
      <circle cx="54" cy="-18" r="3" fill="#c47a0b" />
      <circle cx="55" cy="0" r="3" fill="#c47a0b" />
    </g>

    <!-- Small Unopened Bud on Left -->
    <g transform="translate(-180, 80) rotate(-15)">
      <path d="M0,0 Q-10,120 -5,220" stroke="#364937" stroke-width="7" stroke-linecap="round" fill="none" />
      <path d="M-20,0 Q-30,-70 0,-100 Q30,-70 20,0 Q0,20 -20,0 Z" fill="url(#petalDeep)" />
      <path d="M-15,0 Q-20,-60 0,-90 Q20,-60 15,0" fill="#6d8a6e" opacity="0.6" />
    </g>
  </g>

  <!-- Artist Signature -->
  <g transform="translate(620, 930)">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="20" fill="#4d4640">Indika W.</text>
    <line x1="-10" y1="6" x2="80" y2="6" stroke="#6b6056" stroke-width="1" />
  </g>
</svg>
