<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="rainSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5763" />
      <stop offset="40%" stop-color="#707e8c" />
      <stop offset="70%" stop-color="#a0abb5" />
      <stop offset="100%" stop-color="#c8ced4" />
    </linearGradient>
    <linearGradient id="wetStreet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67737e" />
      <stop offset="35%" stop-color="#3c4652" />
      <stop offset="80%" stop-color="#232a32" />
      <stop offset="100%" stop-color="#14181d" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe699" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#e6b84d" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#b88626" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1000" height="700" fill="#f8f5ee" />
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="#d5cbba" stroke-width="1.2" />

  <g transform="translate(40, 40)">
    <!-- Rainy Sky -->
    <rect width="920" height="340" fill="url(#rainSky)" />

    <!-- Distant Town Buildings (Misty wet washes) -->
    <path d="M0,320 L0,180 L120,180 L120,120 L240,120 L240,190 L380,190 L380,140 L520,140 L520,210 L680,210 L680,160 L800,160 L800,240 L920,240 L920,320 Z" fill="#323b45" opacity="0.6" />
    
    <!-- Wet Street Asphalt Surface with Deep Reflections -->
    <rect y="320" width="920" height="300" fill="url(#wetStreet)" />

    <!-- Street Lamp Post Glow & Reflections -->
    <g transform="translate(240, 180)">
      <!-- Lamp Post -->
      <path d="M0,140 L0,0 Q-15,-20 -30,-15" fill="none" stroke="#1d2228" stroke-width="3" />
      <circle cx="-30" cy="-15" r="5" fill="#fff" />
      <!-- Warm Glow -->
      <circle cx="-30" cy="-15" r="55" fill="url(#lampGlow)" />
      <!-- Long warm reflection on wet asphalt -->
      <path d="M-40,140 Q-30,280 -25,440" stroke="#f2ca6b" stroke-width="6" opacity="0.6" filter="blur(2px)" />
      <path d="M-45,160 Q-30,290 -20,440" stroke="#e0aa41" stroke-width="14" opacity="0.3" filter="blur(4px)" />
    </g>

    <g transform="translate(700, 210)">
      <path d="M0,110 L0,0 Q15,-20 30,-15" fill="none" stroke="#1d2228" stroke-width="3" />
      <circle cx="30" cy="-15" r="5" fill="#fff" />
      <circle cx="30" cy="-15" r="50" fill="url(#lampGlow)" />
      <path d="M25,110 Q30,250 35,410" stroke="#f2ca6b" stroke-width="6" opacity="0.55" filter="blur(2px)" />
      <path d="M20,130 Q30,260 40,410" stroke="#e0aa41" stroke-width="12" opacity="0.25" filter="blur(4px)" />
    </g>

    <!-- Person with Red Umbrella (Striking focal point) -->
    <g transform="translate(480, 310)">
      <!-- Umbrella (Red Watercolor Wash) -->
      <path d="M-45,-40 Q0,-80 45,-40 Q25,-48 0,-50 Q-25,-48 -45,-40 Z" fill="#b82638" stroke="#871725" stroke-width="1.5" />
      <path d="M-30,-44 Q0,-70 30,-44" fill="#d4394d" opacity="0.7" />
      <line x1="0" y1="-80" x2="0" y2="-45" stroke="#1c1919" stroke-width="2" />
      <!-- Umbrella handle & Figure -->
      <line x1="0" y1="-45" x2="0" y2="10" stroke="#1c1919" stroke-width="2" />
      <path d="M-12,5 L12,5 L18,70 L-18,70 Z" fill="#1b2026" />
      <line x1="-8" y1="70" x2="-8" y2="110" stroke="#101418" stroke-width="3" />
      <line x1="8" y1="70" x2="8" y2="110" stroke="#101418" stroke-width="3" />
      <!-- Red and dark reflection stretched on wet street -->
      <path d="M-10,115 Q0,210 -5,310" stroke="#b82638" stroke-width="8" opacity="0.5" filter="blur(3px)" />
      <path d="M-14,115 Q0,220 5,310" stroke="#1b2026" stroke-width="10" opacity="0.65" filter="blur(2px)" />
    </g>

    <!-- Passing Car / Three-wheeler Headlight Streak (Sri Lankan city mood) -->
    <g transform="translate(780, 360)">
      <!-- Silhouette of Three-Wheeler (Tuk-tuk) -->
      <path d="M-60,40 L-50,0 L20,-10 L50,0 L60,40 Z" fill="#202428" />
      <circle cx="-35" cy="40" r="12" fill="#101418" />
      <circle cx="35" cy="40" r="12" fill="#101418" />
      <!-- Headlight beam -->
      <polygon points="60,20 220,10 220,50 60,30" fill="#fff5cc" opacity="0.3" />
      <line x1="60" y1="42" x2="180" y2="120" stroke="#ffe082" stroke-width="6" opacity="0.5" filter="blur(3px)" />
    </g>

    <!-- Diagonal Soft Rain Lines (Fine watercolor texture) -->
    <g stroke="#ffffff" stroke-width="0.8" opacity="0.35">
      <line x1="100" y1="40" x2="70" y2="140" />
      <line x1="280" y1="60" x2="250" y2="160" />
      <line x1="450" y1="30" x2="420" y2="130" />
      <line x1="620" y1="80" x2="590" y2="180" />
      <line x1="800" y1="40" x2="770" y2="140" />
      <line x1="200" y1="200" x2="170" y2="300" />
      <line x1="560" y1="220" x2="530" y2="320" />
      <line x1="720" y1="180" x2="690" y2="280" />
    </g>
  </g>

  <!-- Artist Signature -->
  <g transform="translate(800, 640)">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="19" fill="#3a342c">Indika W.</text>
    <line x1="-8" y1="5" x2="70" y2="5" stroke="#544b3f" stroke-width="1" />
  </g>
</svg>
