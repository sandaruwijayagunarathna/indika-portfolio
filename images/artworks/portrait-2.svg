<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="paperGrad2" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="75%" stop-color="#f3ede1" />
      <stop offset="100%" stop-color="#e8dfce" />
    </radialGradient>
    <pattern id="softHatch" width="6" height="6" patternTransform="rotate(25 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#48423d" stroke-width="0.6" opacity="0.25" />
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#paperGrad2)" />
  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#d5cbba" stroke-width="1.2" />

  <!-- Child Pencil Portrait -->
  <g transform="translate(400, 460)">
    <!-- Soft Face Shape -->
    <path d="M-110,-140 Q-150,20 -100,140 Q0,210 100,140 Q150,20 110,-140 Q0,-220 -110,-140 Z" fill="#f8f4ec" />
    <!-- Cheeks shading -->
    <circle cx="-65" cy="50" r="45" fill="url(#softHatch)" />
    <circle cx="65" cy="50" r="45" fill="url(#softHatch)" />

    <!-- Hair Curls / Tendrils -->
    <path d="M-130,-140 Q-110,-240 0,-240 Q110,-240 130,-140 Q160,-60 140,20 Q120,-80 90,-120 Q0,-180 -90,-120 Q-120,-80 -140,20" fill="#2b2724" />
    <path d="M-90,-150 Q-40,-210 20,-170 Q-10,-150 -50,-130" stroke="#1d1b19" stroke-width="3" fill="none" />
    <path d="M-20,-190 Q50,-220 90,-160" stroke="#1d1b19" stroke-width="2.5" fill="none" />
    
    <!-- Gentle Eyebrows -->
    <path d="M-80,-65 Q-55,-80 -25,-68" fill="none" stroke="#4a423b" stroke-width="2.8" stroke-linecap="round" />
    <path d="M25,-68 Q55,-80 80,-65" fill="none" stroke="#4a423b" stroke-width="2.8" stroke-linecap="round" />

    <!-- Big innocent eyes -->
    <ellipse cx="-52" cy="-40" rx="20" ry="16" fill="#fdfcf8" stroke="#322d28" stroke-width="2.2" />
    <ellipse cx="-52" cy="-40" rx="12" ry="13" fill="#1b1816" />
    <circle cx="-55" cy="-44" r="4" fill="#ffffff" />
    <circle cx="-48" cy="-38" r="1.5" fill="#ffffff" />
    <path d="M-72,-42 Q-52,-58 -32,-42" stroke="#2b2724" stroke-width="2.5" fill="none" />

    <ellipse cx="52" cy="-40" rx="20" ry="16" fill="#fdfcf8" stroke="#322d28" stroke-width="2.2" />
    <ellipse cx="52" cy="-40" rx="12" ry="13" fill="#1b1816" />
    <circle cx="49" cy="-44" r="4" fill="#ffffff" />
    <circle cx="56" cy="-38" r="1.5" fill="#ffffff" />
    <path d="M32,-42 Q52,-58 72,-42" stroke="#2b2724" stroke-width="2.5" fill="none" />

    <!-- Cute button nose -->
    <path d="M-14,20 Q0,26 14,20" stroke="#463f38" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="-10" cy="18" r="2" fill="#3a332d" />
    <circle cx="10" cy="18" r="2" fill="#3a332d" />

    <!-- Warm gentle smile -->
    <path d="M-36,75 Q0,105 36,75" stroke="#2f2a26" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M-22,86 Q0,108 22,86" stroke="#5d534a" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Chin contour -->
    <path d="M-35,135 Q0,165 35,135" stroke="#71675d" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Neck & Simple Garment Line -->
    <path d="M-55,160 L-70,260 M55,160 L70,260" stroke="#84786a" stroke-width="2" fill="none" />
    <path d="M-120,270 Q0,240 120,270 L180,440 L-180,440 Z" fill="#f2ecde" stroke="#7e7264" stroke-width="1.5" />
  </g>

  <g transform="translate(620, 930)">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="20" fill="#4d4640">Indika W.</text>
    <line x1="-10" y1="6" x2="80" y2="6" stroke="#6b6056" stroke-width="1" />
  </g>
</svg>
