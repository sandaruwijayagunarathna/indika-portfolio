<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <radialGradient id="sunHaze" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fcf8f0" />
      <stop offset="50%" stop-color="#f1e8d9" />
      <stop offset="100%" stop-color="#e0d4c0" />
    </radialGradient>
    <pattern id="leafTexture" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2d2822" opacity="0.4" />
    </pattern>
  </defs>

  <rect width="1000" height="700" fill="#f8f5ee" />
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="#d5cbba" stroke-width="1.2" />

  <g transform="translate(40, 40)">
    <!-- Sky & Background Atmosphere -->
    <rect width="920" height="620" fill="url(#sunHaze)" />

    <!-- Distant Foliage & Hills -->
    <path d="M0,340 Q180,310 380,330 Q600,290 920,340 L920,620 L0,620 Z" fill="#cfc2ae" opacity="0.6" />

    <!-- Magnificent Ancient Banyan Tree with Aerial Roots (Dominant on Left) -->
    <g transform="translate(240, 260)">
      <!-- Massive Canopy Silhouette & Hatching -->
      <path d="M-220,-80 Q-240,-200 -120,-220 Q0,-250 160,-210 Q280,-160 260,-60 Q240,40 180,60 Q-40,80 -220,-80 Z" fill="#4d4439" opacity="0.9" />
      <path d="M-180,-60 Q-200,-170 -100,-190 Q20,-220 140,-180 Q220,-130 200,-40 Q180,40 120,50 Q-20,60 -180,-60 Z" fill="url(#leafTexture)" />

      <!-- Massive Trunk & Hanging Aerial Roots -->
      <path d="M-80,60 Q-90,160 -140,320 L-40,320 Q-30,180 -20,60 Z" fill="#2b2620" />
      <path d="M30,60 Q20,180 80,320 L160,320 Q110,180 90,60 Z" fill="#26211a" />
      <!-- Central trunk core -->
      <path d="M-30,40 Q-10,160 10,320 L50,320 Q30,160 40,40 Z" fill="#3a3229" />

      <!-- Tangled Aerial Roots (Fine Pencil & Ink Details) -->
      <path d="M-120,-20 Q-150,120 -180,320" stroke="#3d352b" stroke-width="2.5" fill="none" />
      <path d="M-60,0 Q-100,150 -100,320" stroke="#483f33" stroke-width="3" fill="none" />
      <path d="M-10,10 Q-40,160 -50,320" stroke="#332c24" stroke-width="2.8" fill="none" />
      <path d="M60,-10 Q40,140 30,320" stroke="#42392f" stroke-width="2.5" fill="none" />
      <path d="M120,-30 Q150,130 180,320" stroke="#362f27" stroke-width="3" fill="none" />
      <path d="M160,-10 Q200,140 220,320" stroke="#4a4034" stroke-width="2.2" fill="none" />
    </g>

    <!-- Winding Country Village Footpath -->
    <path d="M260,360 Q380,410 460,460 Q560,520 620,620 L840,620 Q700,500 580,430 Q480,380 400,350 Z" fill="#f0e5d0" stroke="#7d705f" stroke-width="1.5" />
    <!-- Footpath pebbles and texture -->
    <path d="M360,380 Q450,440 540,510" stroke="#968774" stroke-width="1.8" stroke-dasharray="3 6" fill="none" />
    <path d="M420,400 Q510,470 600,560" stroke="#968774" stroke-width="1.5" stroke-dasharray="4 8" fill="none" />

    <!-- Wooden Rural Fence along path -->
    <g transform="translate(560, 390)">
      <!-- Fence posts -->
      <line x1="0" y1="30" x2="-5" y2="90" stroke="#443b31" stroke-width="3.5" />
      <line x1="60" y1="40" x2="55" y2="110" stroke="#443b31" stroke-width="3.5" />
      <line x1="130" y1="55" x2="120" y2="135" stroke="#443b31" stroke-width="4" />
      <line x1="210" y1="80" x2="200" y2="175" stroke="#443b31" stroke-width="4.5" />
      <!-- Horizontal bamboo / timber rails -->
      <path d="M-20,45 L240,110" stroke="#5c5042" stroke-width="2.8" />
      <path d="M-15,65 L235,135" stroke="#5c5042" stroke-width="2.5" />
    </g>

    <!-- Distant Village Thatched Roof Vignette -->
    <path d="M720,350 L770,330 L820,350 L810,380 L730,380 Z" fill="#695c4d" stroke="#3d352b" stroke-width="1.5" />
  </g>

  <!-- Artist Signature -->
  <g transform="translate(800, 640)">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="19" fill="#3a342c">Indika W.</text>
    <line x1="-8" y1="5" x2="70" y2="5" stroke="#544b3f" stroke-width="1" />
  </g>
</svg>
